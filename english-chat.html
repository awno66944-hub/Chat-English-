<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معلم الإنجليزي الذكي</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1d2a;--mut:#6b7090;--pri:#5b5bf0;--me:#5b5bf0;--bd:#e2e4ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131c;--card:#1d1f2e;--tx:#eceefa;--mut:#9a9fc2;--pri:#8080ff;--me:#6c6cf5;--bd:#2c2f45}}
:root[data-theme="dark"]{--bg:#12131c;--card:#1d1f2e;--tx:#eceefa;--mut:#9a9fc2;--pri:#8080ff;--me:#6c6cf5;--bd:#2c2f45}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
header{padding:10px 14px 6px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;font-size:13px;max-width:55%}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px}
.chip{flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:6px 12px;border-radius:99px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.mode{font-size:12px;color:var(--mut);margin-top:2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.go{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 13px;border-radius:16px;line-height:1.6;font-size:15px;white-space:pre-wrap;word-wrap:break-word;direction:auto;text-align:start}
.ai{background:var(--card);border:1px solid var(--bd);align-self:flex-start;border-bottom-right-radius:4px}
.me{background:var(--me);color:#fff;align-self:flex-end;border-bottom-left-radius:4px}
.bar{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--bd)}
input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:11px 13px;font-size:16px;direction:auto}
.send,.mic{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:0 16px;font-size:15px;cursor:pointer}
.mic{background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-size:18px;padding:0 12px}
.mic.live{background:#e5484d;color:#fff;border-color:#e5484d}
.send:disabled{opacity:.5}
.note{text-align:center;color:var(--mut);font-size:13px;padding:4px}
.start{padding:26px 16px}
</style>
</head>
<body>
<header>
  <h1><span>🎓 معلم الإنجليزي</span><select id="lvl"></select></h1>
  <div class="row" id="pers"></div>
  <div class="row" id="tools"></div>
  <div class="mode"><span id="modeTxt"></span><button class="go" id="modeBtn"></button></div>
</header>
<div id="log"></div>
<div class="bar">
  <button class="mic" id="mic" title="تحدث">🎤</button>
  <input id="inp" placeholder="اكتب أو تحدث…" autocomplete="off">
  <button class="send" id="send">إرسال</button>
</div>
<script>
const P={
 emotional:["💗 عاطفي","Warm, caring and emotional. Show feelings and encourage the learner with heartfelt words."],
 sarcastic:["😏 ساخر","Witty and sarcastic in a playful, friendly way. Tease lightly but still teach well."],
 happy:["😄 سعيد","Super happy, energetic and enthusiastic. Lots of cheerful energy and emojis."],
 polite:["🎩 محترم","Very polite, formal and respectful, like a courteous professor."],
 rude:["😈 مو محترم","Cheeky, blunt and disrespectful in a comedic roast style: mock the learner's mistakes playfully. Never use slurs, never attack identity, religion or family, and no profanity; keep it joking and still actually teach."]
};
const L=[
 ["1 · مبتدئ تماماً (من الصفر)","absolute beginner (A0): knows almost no English. Use very simple Arabic explanations and 1-3 word English examples.","alphabet and sounds, greetings, introducing yourself, numbers 1-20, colors, to be (I am / you are), simple nouns"],
 ["2 · مبتدئ (A1)","beginner (A1). Short simple sentences, mostly Arabic explanations.","present simple, to have, this/that, questions with what/where/who, days and months, family, food, daily routine"],
 ["3 · ابتدائي (A2)","elementary (A2). Simple English with Arabic hints.","past simple, future with will/going to, can/must, comparatives, prepositions, shopping and directions"],
 ["4 · متوسط (B1)","intermediate (B1). Mostly English, Arabic only to clarify.","present perfect, conditionals 0/1, modal verbs, phrasal verbs, giving opinions, travel and work vocabulary"],
 ["5 · فوق المتوسط (B2)","upper-intermediate (B2). English only, richer vocabulary.","conditionals 2/3, passive voice, reported speech, linking words, idioms, formal vs informal"],
 ["6 · متقدم (C1)","advanced (C1). Natural, fast English with idioms and nuance.","advanced grammar, collocations, nuance, debate and argument, writing style, slang vs formal register"],
 ["7 · محترف (C2)","near-native (C2). Sophisticated native-level English; challenge the learner.","rare vocabulary, subtle tone, humor and sarcasm in English, rhetoric, regional accents, professional communication"]
];
const KEY="eng_tutor_v1";
let S={pers:"happy",lvl:0,mode:"basics",hist:[],msgs:0,voice:false,read:false,started:false};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{S.hist=S.hist.slice(-40);localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let busy=false,sample=null,rec=null,listening=false;
const $=id=>document.getElementById(id);
const log=$("log"),inp=$("inp"),sendB=$("send"),micB=$("mic");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function sys(){
 const lv=L[S.lvl];
 let b="You are an AI English tutor inside a chat app for Arabic-speaking learners. Learner level: "+lv[1]+" Personality: "+P[S.pers][1]+" Keep replies short (max ~110 words). Gently correct mistakes.";
 if(S.lvl>=5) b+=" LANGUAGE RULE: the learner is C1 or above, so write EVERYTHING in English only. Never use Arabic, not even for hints, translations or corrections, even if the learner writes in Arabic. Explain hard words using simpler English.";
 if(S.mode==="basics") b+=" PHASE: LESSONS. Teach this level's curriculum one small step per message, in order: "+lv[2]+". After each mini lesson give one tiny exercise and wait for the learner's answer before moving on. Do not start free conversation.";
 else b+=" PHASE: CONVERSATION. Have a natural conversation at the learner's level. Ask one follow-up question each turn and correct errors briefly.";
 if(S.voice) b+=" VOICE MODE: the reply will be read aloud, so keep it under 50 words, no emojis, no lists.";
 return b;
}
function render(){
 $("lvl").innerHTML=L.map((l,i)=>'<option value="'+i+'"'+(i===S.lvl?" selected":"")+'>'+l[0]+'</option>').join("");
 $("pers").innerHTML="";
 Object.keys(P).forEach(k=>{
  const b=document.createElement("button");b.className="chip"+(k===S.pers?" on":"");b.textContent=P[k][0];
  b.onclick=()=>{S.pers=k;save();render();note("الشخصية الآن: "+P[k][0])};$("pers").appendChild(b);
 });
 $("tools").innerHTML="";
 [["🎙️ محادثة صوتية",S.voice,toggleVoice],["🔊 قراءة الردود",S.read,()=>{S.read=!S.read;if(!S.read)speechSynthesis.cancel();save();render()}],["🗑️ ابدأ من جديد",false,reset]].forEach(([t,on,fn])=>{
  const b=document.createElement("button");b.className="chip"+(on?" on":"");b.textContent=t;b.onclick=fn;$("tools").appendChild(b);
 });
 const n=S.hist.filter(m=>m.role==="user").length;
 $("modeTxt").textContent=(S.mode==="basics"?"📚 الدروس":"💬 المحادثة")+" · رسائلك: "+S.msgs+" · محفوظ ✓";
 $("modeBtn").textContent=S.mode==="basics"?"ابدأ المحادثة ←":"→ ارجع للدروس";
}
function bubble(c,t){const d=document.createElement("div");d.className="m "+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function note(t){const d=document.createElement("div");d.className="note";d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}

function speak(text,done){
 const clean=text.replace(/[\u0600-\u06FF\u0750-\u077F]+/g," ").replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,"").replace(/\s+/g," ").trim();
 if(!clean||!window.speechSynthesis){done&&done();return}
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(clean);u.lang="en-US";u.rate=.92;
  u.onend=()=>done&&done();u.onerror=()=>done&&done();
  speechSynthesis.speak(u);
 }catch(e){done&&done()}
}
function listen(){
 if(!SR){note("⚠️ المتصفح ما يدعم التعرف على الصوت. جرب Chrome أو Safari.");S.voice=false;render();return}
 if(listening||busy)return;
 try{
  rec=new SR();rec.lang="en-US";rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{listening=true;micB.classList.add("live")};
  rec.onresult=e=>{const t=e.results[0][0].transcript;inp.value=t;submit()};
  rec.onerror=e=>{listening=false;micB.classList.remove("live");
   if(e.error==="not-allowed"||e.error==="service-not-allowed"){note("⚠️ المايك غير مسموح. فعّل الإذن أو اكتب بدلاً من ذلك.");S.voice=false;render()}};
  rec.onend=()=>{listening=false;micB.classList.remove("live")};
  rec.start();
 }catch(e){listening=false}
}
function toggleVoice(){
 S.voice=!S.voice;S.read=S.voice||S.read;save();render();
 if(S.voice){note("🎙️ المحادثة الصوتية شغالة: أرد عليك بصوتي ثم أسمعك.");if(S.started)listen();else note("اضغط «ابدأ الدرس» أول.")}
 else{try{rec&&rec.abort()}catch(e){}speechSynthesis.cancel()}
}

async function ask(userText){
 if(busy)return;
 busy=true;sendB.disabled=true;
 if(userText!==null){S.hist.push({role:"user",content:userText});S.msgs++;bubble("me",userText)}
 let h=S.hist.slice(-16);while(h.length&&h[0].role!=="user")h.shift();
 const msgs=h.map((m,i)=>i===h.length-1?{role:"user",content:"[INSTRUCTIONS: "+sys()+"]\n\n"+m.content}:m);
 const out=bubble("ai","…");let ok=false,reply="";
 try{
  if(!sample)sample=await claude.use("sample");
  if(!sample){out.textContent="⚠️ هذه الميزة غير متاحة في هذا العرض.";}
  else{
   const r=await sample(msgs,{cache:false,onText:({text})=>{out.textContent=text;log.scrollTop=log.scrollHeight}});
   reply=r.text;out.textContent=reply;S.hist.push({role:"assistant",content:reply});ok=true;
  }
 }catch(e){
  out.textContent=e&&e.code==="rate_limited"?"⏳ مشغول شوي، جرب بعد لحظات.":"⚠️ صار خطأ، جرب مرة ثانية.";
  if(userText!==null){S.hist.pop();S.msgs--}
 }
 save();render();busy=false;sendB.disabled=false;
 if(ok&&(S.read||S.voice)){speak(reply,()=>{if(S.voice)setTimeout(listen,250)})}
 else if(!ok&&S.voice){S.voice=false;render()}
 if(!S.voice)inp.focus();
}
function submit(){const t=inp.value.trim();if(!t)return;inp.value="";ask(t)}
function startLesson(){
 S.started=true;log.innerHTML="";save();
 ask("Hi! I'm an Arabic speaker. Start teaching me English from my level.");
}
function reset(){
 if(!confirm("تبي تمسح تقدمك وتبدأ من جديد؟"))return;
 speechSynthesis.cancel();try{rec&&rec.abort()}catch(e){}
 S.hist=[];S.msgs=0;S.mode="basics";S.started=false;S.voice=false;save();init();
}
sendB.onclick=submit;
micB.onclick=()=>{if(listening){try{rec.stop()}catch(e){}}else listen()};
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()}});
$("lvl").onchange=e=>{S.lvl=+e.target.value;save();render();note("تم تغيير المستوى إلى: "+L[S.lvl][0]);if(S.started&&S.mode==="basics")ask("I changed my level. Please adjust and continue.")};
$("modeBtn").onclick=()=>{
 S.mode=S.mode==="basics"?"chat":"basics";save();render();
 note(S.mode==="basics"?"رجعنا للدروس 📚":"بدأت مرحلة المحادثة 💬");
 if(S.started)ask(S.mode==="basics"?"Let's continue the lessons.":"I'm ready to start a conversation.");
};
function init(){
 render();log.innerHTML="";
 if(S.hist.length){
  S.started=true;
  S.hist.forEach(m=>bubble(m.role==="user"?"me":"ai",m.content));
  note("✓ رجّعت لك تقدمك المحفوظ. كمّل من حيث وقفت.");
 }else{
  const d=document.createElement("div");d.className="note start";
  d.innerHTML='اختر مستواك من الأعلى (من الصفر إلى محترف) وشخصية معلمك، ثم ابدأ.<br><br><button class="go" id="start" style="font-size:15px;padding:10px 22px">ابدأ الدرس 🚀</button>';
  log.appendChild(d);$("start").onclick=startLesson;
 }
}
init();
</script>
</body>
</html>
